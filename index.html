<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Induct Pace Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Induct Tracker">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0a0d10;
    --panel: #13171c;
    --panel-2: #1a1f26;
    --line: #262d36;
    --amber: #ffb627;
    --green: #34d17c;
    --red: #ff5a5f;
    --steel: #8a94a6;
    --text: #e8ebee;
    --text-dim: #9aa3af;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 50% -10%, #151a20 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    padding: 20px 14px 60px;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  .wrap{ max-width: 880px; margin:0 auto; }

  header{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom: 18px; gap: 10px; flex-wrap:wrap;
  }
  .title{ font-size: 15px; font-weight:700; letter-spacing:.3px; color: var(--text); }
  .subtitle{ font-size: 11.5px; color: var(--text-dim); margin-top:3px; }
  .clock{
    font-size: 26px; font-weight:600; color: var(--amber);
    letter-spacing: 1px;
  }
  .clock-date{ font-size: 10.5px; color: var(--text-dim); text-align:right; margin-top:2px; }
  .lang-toggle{
    display:flex; gap:6px; margin-top:8px; justify-content:flex-end;
  }
  .lang-btn{
    background: var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
    border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer; font-family:'Inter',sans-serif;
    font-weight:600;
  }
  .lang-btn.active{ color:#171208; background:var(--amber); border-color:var(--amber); }

  .setup-card{
    background: var(--panel); border:1px solid var(--line); border-radius:14px;
    padding: 22px; margin-bottom:16px;
  }
  .setup-card h2{ font-size:14px; margin:0 0 14px; color: var(--text); }
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field select{
    width:100%; background: var(--panel-2); border:1px solid var(--line); border-radius:8px;
    color: var(--text); padding: 10px 12px; font-size:15px; font-family:'IBM Plex Mono',monospace;
    appearance:none;
  }
  .field select{ font-family:'Inter',sans-serif; font-size:14px; cursor:pointer; }
  .field input:focus, .field select:focus{ outline:none; border-color: var(--amber); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .btn{
    background: var(--amber); color:#171208; border:none; border-radius:9px;
    padding: 12px 18px; font-size:14px; font-weight:700; cursor:pointer;
    font-family:'Inter',sans-serif; width:100%;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-ghost{
    background:transparent; color: var(--text-dim); border:1px solid var(--line);
    border-radius:9px; padding:8px 14px; font-size:12px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn-ghost:hover{ color: var(--text); border-color: var(--steel); }

  .link-card{
    background: var(--panel); border:1px solid var(--line); border-radius:14px;
    padding: 16px 18px; margin-bottom:14px;
  }
  .link-row{ display:flex; gap:10px; align-items:flex-end; }
  .link-field{ flex:1; }
  .link-field label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:6px; }
  .link-field input{
    width:100%; background: var(--panel-2); border:1px solid var(--line); border-radius:8px;
    color: var(--text); padding: 9px 12px; font-size:13px; font-family:'IBM Plex Mono',monospace;
  }
  .link-field input:focus{ outline:none; border-color: var(--amber); }
  .link-open{ white-space:nowrap; padding:9px 16px; }
  .link-hint{ font-size:10.5px; color:var(--text-dim); margin-top:8px; line-height:1.7; }

  .status-card{
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--line); border-radius:16px; padding: 24px; margin-bottom:16px;
    position:relative; overflow:hidden;
  }
  .status-band{
    position:absolute; inset:0 0 auto 0; height:4px;
  }
  .status-label{
    font-size:13px; color:var(--text-dim); margin-bottom:4px;
  }
  .status-headline{
    font-size: 30px; font-weight:800; margin-bottom: 2px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  }
  .status-sub{ font-size:12.5px; color: var(--text-dim); }

  .flap-row{
    display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-top:20px;
  }
  .flap{
    background:#0d1013; border:1px solid var(--line); border-radius:10px;
    padding:14px 10px; text-align:center;
  }
  .flap .val{
    font-size:26px; font-weight:700; letter-spacing:.5px;
  }
  .flap .lbl{
    font-size:10.5px; color:var(--text-dim); margin-top:6px;
  }

  .bar-wrap{ margin-top:20px; }
  .bar-track{
    background:#0d1013; border:1px solid var(--line); border-radius:999px; height:16px; position:relative; overflow:hidden;
  }
  .bar-fill{
    height:100%; border-radius:999px; transition: width .4s ease, background .4s ease;
  }
  .bar-target-mark{
    position:absolute; top:-3px; bottom:-3px; width:2px; background: var(--text);
    box-shadow: 0 0 0 2px rgba(255,255,255,.08);
  }
  .bar-labels{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-dim); margin-top:6px; }

  .break-note{
    margin-top:10px; font-size:11px; color:var(--amber); display:none;
  }
  .break-note.show{ display:block; }

  .log-card{
    background: var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px;
  }
  .log-card h3{ font-size:13px; margin:0 0 12px; }
  .log-input-row{ display:flex; gap:10px; }
  .log-input-row input{ flex:1; }
  .log-input-row button{ width:auto; padding: 10px 20px; }
  .history{ margin-top:16px; max-height:160px; overflow-y:auto; }
  .history-item{
    display:flex; justify-content:space-between; font-size:12px; padding:7px 2px;
    border-bottom:1px solid var(--line); color: var(--text-dim);
  }
  .history-item .cnt{ color: var(--text); font-family:'IBM Plex Mono',monospace; }

  .footer-row{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:10px; flex-wrap:wrap; }
  .hint{ font-size:11px; color:var(--text-dim); line-height:1.9; margin-top:10px; }

  .pulse{ animation: pulseAnim .5s ease; }
  @keyframes pulseAnim{
    0%{ transform: scale(1); }
    30%{ transform: scale(1.04); }
    100%{ transform: scale(1); }
  }

  .hidden{ display:none !important; }

  @media (max-width:480px){
    .flap-row{ grid-template-columns: 1fr 1fr; }
    .flap-row .flap:last-child{ grid-column: span 2; }
    .status-headline{ font-size:24px; }
    .row3{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="title" id="tTitle">Induct Pace Tracker</div>
      <div class="subtitle" id="dayTotalLabel">—</div>
      <div class="subtitle" id="requiredPaceLabel" style="color:var(--amber); font-weight:600; margin-top:2px;"></div>
    </div>
    <div style="text-align:right">
      <div class="clock mono" id="clockNow">--:--:--</div>
      <div class="clock-date" id="clockDate">—</div>
      <div class="lang-toggle">
        <button class="lang-btn" id="btnLangEn">EN</button>
        <button class="lang-btn" id="btnLangDe">DE</button>
      </div>
    </div>
  </header>

  <!-- SETUP -->
  <div class="setup-card" id="setupCard">
    <h2 id="tSetupHeading">Start today's shift</h2>
    <div class="field">
      <label id="lblTotal">Total packages today</label>
      <input type="number" id="inputTotal" inputmode="numeric">
    </div>
    <div class="row2">
      <div class="field">
        <label id="lblStart">Shift start time</label>
        <select id="inputStart"></select>
      </div>
      <div class="field">
        <label id="lblEnd">Shift end time</label>
        <select id="inputEnd"></select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label id="lblBreakStart">Break start time (30 min)</label>
        <input type="time" id="inputBreakStart" value="05:00">
      </div>
      <div class="field">
        <label id="lblBuffer">Safety buffer (min)</label>
        <input type="number" id="inputBuffer" value="15" inputmode="numeric">
      </div>
    </div>
    <button class="btn" id="btnStart">Start tracking</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="link-card" id="linkCard">
      <div class="link-row">
        <div class="link-field">
          <label id="tLinkLabel">WMS panel link (reference)</label>
          <input type="url" id="inputPanelLink" placeholder="https://...">
        </div>
        <button class="btn-ghost link-open" id="btnOpenPanel"></button>
      </div>
      <div class="link-hint" id="tLinkHint"></div>
    </div>

    <div class="status-card">
      <div class="status-band" id="statusBand"></div>
      <div class="status-label" id="tStatusLabel">Current status</div>
      <div class="status-headline">
        <span id="statusMain" class="mono">—</span>
      </div>
      <div class="status-sub" id="statusSub">—</div>

      <div class="flap-row">
        <div class="flap">
          <div class="val mono" id="flapTarget">0</div>
          <div class="lbl" id="tFlapTargetLbl">should be processed by now</div>
        </div>
        <div class="flap">
          <div class="val mono" id="flapActual">0</div>
          <div class="lbl" id="tFlapActualLbl">actually processed</div>
        </div>
        <div class="flap">
          <div class="val mono" id="flapDelta">0</div>
          <div class="lbl" id="tFlapDeltaLbl">difference (packages)</div>
        </div>
      </div>

      <div class="bar-wrap">
        <div class="bar-track">
          <div class="bar-fill" id="barFill" style="width:0%; background:var(--amber);"></div>
          <div class="bar-target-mark" id="barTargetMark" style="left:0%;"></div>
        </div>
        <div class="bar-labels">
          <span id="barPct">0% of packages</span>
          <span id="timePct">0% of working time elapsed</span>
        </div>
      </div>

      <div class="hint" id="paceHint"></div>
    </div>

    <div class="log-card">
      <h3 id="tLogHeading">Log new progress</h3>
      <div class="log-input-row">
        <input type="number" id="inputActual" inputmode="numeric" class="mono">
        <button class="btn" id="btnLog" style="width:auto;"></button>
      </div>
      <div class="history" id="historyList"></div>
    </div>

    <div class="footer-row">
      <button class="btn-ghost" id="btnEditConfig"></button>
      <button class="btn-ghost" id="btnResetDay"></button>
    </div>
  </div>

</div>

<script>
(function(){
  // Fallback storage shim: outside Claude's artifact runtime, window.storage
  // doesn't exist. When missing, back it with localStorage so data still
  // persists on a standalone deployment (Vercel, GitHub Pages, etc.).
  if(!window.storage){
    window.storage = {
      async get(key){
        const raw = localStorage.getItem(key);
        if(raw === null){ throw new Error('not found'); }
        return { key, value: raw };
      },
      async set(key, value){
        localStorage.setItem(key, value);
        return { key, value };
      },
      async delete(key){
        localStorage.removeItem(key);
        return { key, deleted:true };
      },
      async list(prefix){
        const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
        return { keys, prefix };
      }
    };
  }

  const STORAGE_KEY_CONFIG = 'config';

  const I18N = {
    en: {
      title: 'Induct Pace Tracker',
      setupHeading: "Start today's shift",
      lblTotal: 'Total packages today',
      placeholderTotal: 'e.g. 28000',
      lblStart: 'Shift start time',
      lblEnd: 'Shift end time',
      lblBreakStart: 'Break start time (30 min)',
      lblBreakDur: 'Break duration (min)',
      lblBuffer: 'Safety buffer (min)',
      breakInfo: 'A fixed 30-minute unpaid break (German law) is automatically subtracted from the working window.',
      requiredPace: (n) => `Required pace: ${n} packages/hour to finish on time`,
      btnStart: 'Start tracking',
      statusLabel: 'Current status',
      flapTargetLbl: 'should be processed by now',
      flapActualLbl: 'actually processed',
      flapDeltaLbl: 'difference (packages)',
      logHeading: 'Log new progress',
      placeholderActual: 'Packages processed so far',
      btnLog: 'Log',
      btnEditConfig: 'Edit times / buffer',
      btnResetDay: 'Start new day',
      totalLabel: (n, s, e) => `Total today: ${n} packages  •  Window: ${s} – ${e}`,
      notStarted: 'Not started yet',
      shiftStartsAt: (s) => `Shift starts at ${s}`,
      waitingData: 'Waiting for data',
      noTotalEntered: 'Total package count not entered',
      onBreak: 'On break',
      onBreakSub: (t) => `Break ends at ${t} — target pace is paused`,
      aheadBy: (n) => `${n} packages ahead`,
      behindBy: (n) => `${n} packages behind`,
      roughlyAhead: (m) => `roughly ${m} ahead of schedule`,
      roughlyBehind: (m) => `roughly ${m} behind schedule`,
      lessThanMin: 'less than 1 minute',
      minutes: (n) => `${n} minutes`,
      deadlineReached: 'Deadline (incl. buffer) has been reached',
      pctPackages: (n) => `${n}% of packages processed`,
      pctTime: (n) => `${n}% of working time elapsed`,
      paceNeeded: (rate, planned) => `To finish on time, you now need roughly ${rate} packages/hour from this point on (planned pace: ${planned} packages/hour).`,
      allDone: 'All of today\'s packages are processed — done for the day.',
      confirmTotal: 'Please enter the total packages for today.',
      confirmReset: 'Start a new day and clear today\'s data?',
      linkLabel: 'WMS panel link (reference)',
      linkOpen: 'Open panel',
      linkHint: 'Not connected automatically — this just opens your saved link in a new tab. Keep entering counts manually below.',
      onTrackMsg: 'Right on pace — keep the current speed.',
      speedUp: (rate, planned) => `Behind pace — speed up to roughly ${rate} packages/hour to catch up (planned pace: ${planned}/hour).`,
      easeOff: (rate, planned) => `Ahead of pace — holding roughly ${rate} packages/hour is enough to stay on track, you can ease off a bit (planned pace: ${planned}/hour).`,
      opts: {
        start: [
          {v:'00:30', l:'12:30 AM'},
          {v:'01:00', l:'1:00 AM'},
          {v:'02:00', l:'2:00 AM'}
        ],
        end: [
          {v:'08:45', l:'8:45 AM'},
          {v:'09:00', l:'9:00 AM'},
          {v:'09:15', l:'9:15 AM'}
        ]
      }
    },
    de: {
      title: 'Induct-Tempo-Tracker',
      setupHeading: 'Heutige Schicht starten',
      lblTotal: 'Pakete gesamt heute',
      placeholderTotal: 'z. B. 28000',
      lblStart: 'Schichtbeginn',
      lblEnd: 'Schichtende',
      lblBreakStart: 'Pausenbeginn (30 Min.)',
      lblBreakDur: 'Pausendauer (Min.)',
      lblBuffer: 'Sicherheitspuffer (Min.)',
      breakInfo: 'Eine feste, unbezahlte 30-minütige Pause (gesetzlich vorgeschrieben) wird automatisch vom Arbeitsfenster abgezogen.',
      requiredPace: (n) => `Erforderliches Tempo: ${n} Pakete/Stunde, um pünktlich fertig zu werden`,
      btnStart: 'Tracking starten',
      statusLabel: 'Aktueller Status',
      flapTargetLbl: 'sollte bis jetzt bearbeitet sein',
      flapActualLbl: 'tatsächlich bearbeitet',
      flapDeltaLbl: 'Differenz (Pakete)',
      logHeading: 'Neuen Fortschritt eintragen',
      placeholderActual: 'Bisher bearbeitete Pakete',
      btnLog: 'Eintragen',
      btnEditConfig: 'Zeiten / Puffer bearbeiten',
      btnResetDay: 'Neuen Tag starten',
      totalLabel: (n, s, e) => `Gesamt heute: ${n} Pakete  •  Zeitfenster: ${s} – ${e}`,
      notStarted: 'Noch nicht gestartet',
      shiftStartsAt: (s) => `Schicht beginnt um ${s}`,
      waitingData: 'Warte auf Daten',
      noTotalEntered: 'Gesamtanzahl der Pakete nicht eingetragen',
      onBreak: 'Pause',
      onBreakSub: (t) => `Pause endet um ${t} — Zielwert pausiert`,
      aheadBy: (n) => `${n} Pakete voraus`,
      behindBy: (n) => `${n} Pakete im Rückstand`,
      roughlyAhead: (m) => `etwa ${m} vor dem Zeitplan`,
      roughlyBehind: (m) => `etwa ${m} hinter dem Zeitplan`,
      lessThanMin: 'weniger als 1 Minute',
      minutes: (n) => `${n} Minuten`,
      deadlineReached: 'Frist (inkl. Puffer) erreicht',
      pctPackages: (n) => `${n}% der Pakete bearbeitet`,
      pctTime: (n) => `${n}% der Arbeitszeit vergangen`,
      paceNeeded: (rate, planned) => `Um pünktlich fertig zu werden, braucht es ab jetzt etwa ${rate} Pakete/Stunde (geplantes Tempo: ${planned} Pakete/Stunde).`,
      allDone: 'Alle heutigen Pakete sind bearbeitet — fertig für heute.',
      confirmTotal: 'Bitte die Gesamtanzahl der heutigen Pakete eingeben.',
      confirmReset: 'Neuen Tag starten und heutige Daten löschen?',
      linkLabel: 'WMS-Panel-Link (Referenz)',
      linkOpen: 'Panel öffnen',
      linkHint: 'Keine automatische Verbindung — öffnet nur den gespeicherten Link in einem neuen Tab. Zahlen weiterhin manuell unten eintragen.',
      onTrackMsg: 'Genau im Zeitplan — aktuelles Tempo beibehalten.',
      speedUp: (rate, planned) => `Hinter dem Zeitplan — auf etwa ${rate} Pakete/Stunde beschleunigen, um aufzuholen (geplantes Tempo: ${planned}/Stunde).`,
      easeOff: (rate, planned) => `Vor dem Zeitplan — etwa ${rate} Pakete/Stunde reichen, um im Plan zu bleiben, ihr könnt etwas langsamer machen (geplantes Tempo: ${planned}/Stunde).`,
      opts: {
        start: [
          {v:'00:30', l:'00:30 Uhr'},
          {v:'01:00', l:'01:00 Uhr'},
          {v:'02:00', l:'02:00 Uhr'}
        ],
        end: [
          {v:'08:45', l:'08:45 Uhr'},
          {v:'09:00', l:'09:00 Uhr'},
          {v:'09:15', l:'09:15 Uhr'}
        ]
      }
    }
  };

  let lang = 'en';
  let isEditing = false;
  const BREAK_MINUTES = 30;
  let config = { startTime:'02:00', shiftEnd:'09:00', bufferMinutes:15, breakStart:'05:00', lang:'en', panelLink:'' };
  let dayData = { totalPackages: null, log: [] };
  let dayKey = todayKey();

  function t(key){ return I18N[lang][key]; }

  function todayKey(){
    const d = new Date();
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `day:${y}-${m}-${day}`;
  }
  function fmtClock(d){ return d.toLocaleTimeString('en-GB', {hour12:false}); }
  function fmtTimeShort(d){ return d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', hour12:false}); }
  function fmtNum(n){ return Math.round(n).toLocaleString(lang === 'de' ? 'de-DE' : 'en-US'); }

  async function loadConfig(){
    try{
      const r = await window.storage.get(STORAGE_KEY_CONFIG, false);
      if(r && r.value) config = Object.assign(config, JSON.parse(r.value));
    }catch(e){ /* defaults */ }
    lang = config.lang === 'de' ? 'de' : 'en';
  }
  async function saveConfig(){
    config.lang = lang;
    try{ await window.storage.set(STORAGE_KEY_CONFIG, JSON.stringify(config), false); }
    catch(e){ console.error('config save failed', e); }
  }
  async function loadDay(){
    dayKey = todayKey();
    try{
      const r = await window.storage.get(dayKey, false);
      if(r && r.value) dayData = JSON.parse(r.value);
      else dayData = { totalPackages: null, log: [] };
    }catch(e){
      dayData = { totalPackages: null, log: [] };
    }
  }
  async function saveDay(){
    try{ await window.storage.set(dayKey, JSON.stringify(dayData), false); }
    catch(e){ console.error('day save failed', e); }
  }

  function parseTimeToday(hhmm){
    const [h,m] = hhmm.split(':').map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    return d;
  }

  function getWindow(){
    const start = parseTimeToday(config.startTime);
    const shiftEnd = parseTimeToday(config.shiftEnd);
    const deadline = new Date(shiftEnd.getTime() - (config.bufferMinutes||0)*60000);
    const breakStart = parseTimeToday(config.breakStart);
    const breakEnd = new Date(breakStart.getTime() + BREAK_MINUTES*60000);
    return {start, deadline, shiftEnd, breakStart, breakEnd};
  }

  function computeState(){
    const {start, deadline, shiftEnd, breakStart, breakEnd} = getWindow();
    const now = new Date();
    const breakDurMs = BREAK_MINUTES*60000;

    const rawWindowMs = deadline - start;
    const workingWindowMs = Math.max(0, rawWindowMs - breakDurMs);

    let elapsedRaw = now - start;
    if(elapsedRaw < 0) elapsedRaw = 0;
    if(elapsedRaw > rawWindowMs) elapsedRaw = rawWindowMs;

    // Subtract only the portion of the break that has actually elapsed by "now",
    // so the target pace pauses precisely during the break window.
    const overlapEnd = new Date(Math.min(now.getTime(), breakEnd.getTime()));
    let overlap = overlapEnd - breakStart;
    if(overlap < 0) overlap = 0;
    if(overlap > breakDurMs) overlap = breakDurMs;

    const elapsedWorking = Math.max(0, elapsedRaw - overlap);

    const total = dayData.totalPackages || 0;
    const targetNow = workingWindowMs > 0 ? total * (elapsedWorking/workingWindowMs) : 0;

    const lastLog = dayData.log.length ? dayData.log[dayData.log.length-1] : null;
    const actual = lastLog ? lastLog.count : 0;

    const delta = actual - targetNow;
    const rate = workingWindowMs > 0 ? total / (workingWindowMs/3600000) : 0;
    const deltaMinutes = rate > 0 ? (delta / rate) * 60 : 0;

    const beforeStart = now < start;
    const afterDeadline = now > deadline;
    const onBreak = now >= breakStart && now < breakEnd;

    const pctTime = workingWindowMs > 0 ? Math.min(100, Math.max(0, (elapsedWorking/workingWindowMs)*100)) : 0;
    const pctPkg = total > 0 ? Math.min(100, Math.max(0, (actual/total)*100)) : 0;

    const remainingWorkingMs = Math.max(0, workingWindowMs - elapsedWorking);
    const remainingPkgs = total - actual;
    const neededRatePerHour = remainingWorkingMs > 0 ? remainingPkgs / (remainingWorkingMs/3600000) : null;

    return { start, deadline, shiftEnd, breakStart, breakEnd, now, total, targetNow, actual, delta, deltaMinutes,
      beforeStart, afterDeadline, onBreak, pctTime, pctPkg, rate, neededRatePerHour, remainingPkgs };
  }

  function populateSelects(){
    const startSel = document.getElementById('inputStart');
    const endSel = document.getElementById('inputEnd');
    startSel.innerHTML = '';
    endSel.innerHTML = '';
    t('opts').start.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o.v; opt.textContent = o.l;
      startSel.appendChild(opt);
    });
    t('opts').end.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o.v; opt.textContent = o.l;
      endSel.appendChild(opt);
    });
    startSel.value = config.startTime;
    endSel.value = config.shiftEnd;
  }

  function applyStaticText(){
    document.documentElement.lang = lang;
    document.getElementById('tTitle').textContent = t('title');
    document.getElementById('tSetupHeading').textContent = t('setupHeading');
    document.getElementById('lblTotal').textContent = t('lblTotal');
    document.getElementById('inputTotal').placeholder = t('placeholderTotal');
    document.getElementById('lblStart').textContent = t('lblStart');
    document.getElementById('lblEnd').textContent = t('lblEnd');
    document.getElementById('lblBreakStart').textContent = t('lblBreakStart');
    document.getElementById('lblBuffer').textContent = t('lblBuffer');
    document.getElementById('btnStart').textContent = t('btnStart');
    document.getElementById('tStatusLabel').textContent = t('statusLabel');
    document.getElementById('tFlapTargetLbl').textContent = t('flapTargetLbl');
    document.getElementById('tFlapActualLbl').textContent = t('flapActualLbl');
    document.getElementById('tFlapDeltaLbl').textContent = t('flapDeltaLbl');
    document.getElementById('tLogHeading').textContent = t('logHeading');
    document.getElementById('inputActual').placeholder = t('placeholderActual');
    document.getElementById('btnLog').textContent = t('btnLog');
    document.getElementById('btnEditConfig').textContent = t('btnEditConfig');
    document.getElementById('btnResetDay').textContent = t('btnResetDay');
    document.getElementById('btnLangEn').classList.toggle('active', lang==='en');
    document.getElementById('btnLangDe').classList.toggle('active', lang==='de');
    document.getElementById('tLinkLabel').textContent = t('linkLabel');
    document.getElementById('btnOpenPanel').textContent = t('linkOpen');
    document.getElementById('tLinkHint').textContent = t('linkHint');
    populateSelects();
  }

  function render(){
    document.getElementById('clockNow').textContent = fmtClock(new Date());
    document.getElementById('clockDate').textContent = new Date().toLocaleDateString(lang === 'de' ? 'de-DE' : 'en-GB');

    if(!dayData.totalPackages || isEditing){
      document.getElementById('setupCard').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
      return;
    }
    document.getElementById('setupCard').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');

    const s = computeState();
    document.getElementById('dayTotalLabel').textContent =
      t('totalLabel')(fmtNum(s.total), fmtTimeShort(s.start), fmtTimeShort(s.deadline));
    document.getElementById('requiredPaceLabel').textContent =
      s.total > 0 ? t('requiredPace')(fmtNum(s.rate)) : '';

    const band = document.getElementById('statusBand');
    const main = document.getElementById('statusMain');
    const sub = document.getElementById('statusSub');
    const barFill = document.getElementById('barFill');
    const barMark = document.getElementById('barTargetMark');

    if(s.beforeStart){
      band.style.background = 'var(--steel)';
      main.style.color = 'var(--steel)';
      main.textContent = t('notStarted');
      sub.textContent = t('shiftStartsAt')(fmtTimeShort(s.start));
    } else if (s.total <= 0) {
      band.style.background = 'var(--steel)';
      main.style.color = 'var(--steel)';
      main.textContent = t('waitingData');
      sub.textContent = t('noTotalEntered');
    } else if (s.onBreak) {
      band.style.background = 'var(--amber)';
      main.style.color = 'var(--amber)';
      main.textContent = t('onBreak');
      sub.textContent = t('onBreakSub')(fmtTimeShort(s.breakEnd));
    } else {
      const absDelta = Math.abs(s.delta);
      const isAhead = s.delta >= -1;
      const color = isAhead ? 'var(--green)' : 'var(--red)';
      band.style.background = color;
      main.style.color = color;
      main.textContent = isAhead ? t('aheadBy')(fmtNum(absDelta)) : t('behindBy')(fmtNum(absDelta));

      const minTxt = Math.abs(s.deltaMinutes) < 1 ? t('lessThanMin') : t('minutes')(fmtNum(Math.abs(s.deltaMinutes)));
      sub.textContent = isAhead ? t('roughlyAhead')(minTxt) : t('roughlyBehind')(minTxt);
      if(s.afterDeadline){ sub.textContent += '  •  ' + t('deadlineReached'); }
    }

    document.getElementById('flapTarget').textContent = fmtNum(s.targetNow);
    document.getElementById('flapActual').textContent = fmtNum(s.actual);
    const deltaEl = document.getElementById('flapDelta');
    deltaEl.textContent = (s.delta >= 0 ? '+' : '−') + fmtNum(Math.abs(s.delta));
    deltaEl.style.color = s.total>0 ? (s.delta >= -1 ? 'var(--green)' : 'var(--red)') : 'var(--text)';

    barFill.style.width = s.pctPkg + '%';
    barFill.style.background = s.total>0 ? (s.delta >= -1 ? 'var(--green)' : 'var(--red)') : 'var(--amber)';
    barMark.style.left = s.pctTime + '%';
    document.getElementById('barPct').textContent = t('pctPackages')(fmtNum(s.pctPkg));
    document.getElementById('timePct').textContent = t('pctTime')(fmtNum(s.pctTime));

    const paceHint = document.getElementById('paceHint');
    if(s.total>0 && !s.beforeStart && !s.afterDeadline && !s.onBreak){
      if(s.remainingPkgs <= 0){
        paceHint.textContent = t('allDone');
      } else if(s.neededRatePerHour !== null){
        const onTrack = Math.abs(s.deltaMinutes) <= 2;
        if(onTrack){
          paceHint.textContent = t('onTrackMsg');
        } else if(s.delta < 0){
          paceHint.textContent = t('speedUp')(fmtNum(s.neededRatePerHour), fmtNum(s.rate));
        } else {
          paceHint.textContent = t('easeOff')(fmtNum(s.neededRatePerHour), fmtNum(s.rate));
        }
      } else {
        paceHint.textContent = '';
      }
    } else {
      paceHint.textContent = '';
    }

    const hist = document.getElementById('historyList');
    hist.innerHTML = '';
    [...dayData.log].reverse().forEach(item => {
      const row = document.createElement('div');
      row.className = 'history-item';
      const time = new Date(item.time);
      row.innerHTML = `<span>${fmtTimeShort(time)}</span><span class="cnt mono">${fmtNum(item.count)}</span>`;
      hist.appendChild(row);
    });
  }

  // ---- events ----
  document.getElementById('btnStart').addEventListener('click', async () => {
    const total = parseInt(document.getElementById('inputTotal').value, 10);
    const start = document.getElementById('inputStart').value;
    const end = document.getElementById('inputEnd').value;
    const breakStart = document.getElementById('inputBreakStart').value;
    const buf = parseInt(document.getElementById('inputBuffer').value, 10);
    if(!total || total <= 0){ alert(t('confirmTotal')); return; }
    config.startTime = start;
    config.shiftEnd = end;
    config.breakStart = breakStart || '05:00';
    config.bufferMinutes = isNaN(buf) ? 15 : buf;
    if(!isEditing){ dayData.log = []; }
    dayData.totalPackages = total;
    isEditing = false;
    await saveConfig();
    await saveDay();
    render();
  });

  document.getElementById('btnLog').addEventListener('click', async () => {
    const val = parseInt(document.getElementById('inputActual').value, 10);
    if(isNaN(val) || val < 0){ return; }
    dayData.log.push({ time: new Date().toISOString(), count: val });
    await saveDay();
    document.getElementById('inputActual').value = '';
    render();
    const flap = document.getElementById('flapActual');
    flap.classList.remove('pulse'); void flap.offsetWidth; flap.classList.add('pulse');
  });

  document.getElementById('inputActual').addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ document.getElementById('btnLog').click(); }
  });

  document.getElementById('btnResetDay').addEventListener('click', async () => {
    if(!confirm(t('confirmReset'))) return;
    dayData = { totalPackages: null, log: [] };
    isEditing = false;
    await saveDay();
    render();
  });

  document.getElementById('btnEditConfig').addEventListener('click', () => {
    isEditing = true;
    document.getElementById('inputTotal').value = dayData.totalPackages || '';
    document.getElementById('inputStart').value = config.startTime;
    document.getElementById('inputEnd').value = config.shiftEnd;
    document.getElementById('inputBreakStart').value = config.breakStart;
    document.getElementById('inputBuffer').value = config.bufferMinutes;
    document.getElementById('setupCard').classList.remove('hidden');
    document.getElementById('dashboard').classList.add('hidden');
  });

  async function setLang(l){
    lang = l;
    applyStaticText();
    render();
    await saveConfig();
  }
  document.getElementById('btnLangEn').addEventListener('click', () => setLang('en'));
  document.getElementById('btnLangDe').addEventListener('click', () => setLang('de'));

  document.getElementById('inputPanelLink').addEventListener('change', async (e) => {
    config.panelLink = e.target.value.trim();
    await saveConfig();
  });
  document.getElementById('btnOpenPanel').addEventListener('click', () => {
    const url = document.getElementById('inputPanelLink').value.trim();
    if(!url) return;
    window.open(url, '_blank', 'noopener');
  });

  // ---- init ----
  async function init(){
    await loadConfig();
    await loadDay();
    applyStaticText();
    document.getElementById('inputBreakStart').value = config.breakStart;
    document.getElementById('inputBuffer').value = config.bufferMinutes;
    document.getElementById('inputPanelLink').value = config.panelLink || '';
    render();
    setInterval(async () => {
      const k = todayKey();
      if(k !== dayKey){ await loadDay(); }
      render();
    }, 1000);
  }
  init();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Induct Pace Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Induct Tracker">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0a0d10;
    --panel: #13171c;
    --panel-2: #1a1f26;
    --line: #262d36;
    --amber: #ffb627;
    --green: #34d17c;
    --red: #ff5a5f;
    --steel: #8a94a6;
    --text: #e8ebee;
    --text-dim: #9aa3af;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 50% -10%, #151a20 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    padding: 20px 14px 60px;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  .wrap{ max-width: 880px; margin:0 auto; }

  header{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom: 18px; gap: 10px; flex-wrap:wrap;
  }
  .title{ font-size: 15px; font-weight:700; letter-spacing:.3px; color: var(--text); }
  .subtitle{ font-size: 11.5px; color: var(--text-dim); margin-top:3px; }
  .stat-total{ font-size: 11.5px; color: var(--text-dim); margin-top:5px; }
  .stat-pace{ font-size: 11.5px; color: var(--text-dim); margin-top:3px; }
  .num-total{
    font-size: 17px; font-weight:800; color: var(--text);
    font-family:'IBM Plex Mono', monospace;
  }
  .num-pace{
    font-size: 19px; font-weight:800; color: var(--amber);
    font-family:'IBM Plex Mono', monospace;
  }
  .clock{
    font-size: 26px; font-weight:600; color: var(--amber);
    letter-spacing: 1px;
  }
  .clock-date{ font-size: 10.5px; color: var(--text-dim); text-align:right; margin-top:2px; }
  .lang-toggle{
    display:flex; gap:6px; margin-top:8px; justify-content:flex-end;
  }
  .lang-btn{
    background: var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
    border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer; font-family:'Inter',sans-serif;
    font-weight:600;
  }
  .lang-btn.active{ color:#171208; background:var(--amber); border-color:var(--amber); }

  .setup-card{
    background: var(--panel); border:1px solid var(--line); border-radius:14px;
    padding: 22px; margin-bottom:16px;
  }
  .setup-card h2{ font-size:14px; margin:0 0 14px; color: var(--text); }
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field select{
    width:100%; background: var(--panel-2); border:1px solid var(--line); border-radius:8px;
    color: var(--text); padding: 10px 12px; font-size:15px; font-family:'IBM Plex Mono',monospace;
    appearance:none;
  }
  .field select{ font-family:'Inter',sans-serif; font-size:14px; cursor:pointer; }
  .field input:focus, .field select:focus{ outline:none; border-color: var(--amber); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .wave-card{
    border:1px solid var(--line); border-radius:10px; padding:10px 10px 8px; margin-bottom:8px;
    background: rgba(255,255,255,0.015);
  }
  .wave-row-top{
    display:grid; grid-template-columns: 150px 1fr 32px; gap:6px; align-items:center;
  }
  .wave-row-bottom{
    display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-top:6px;
  }
  .wave-or-label{ font-size:10px; color:var(--text-dim); margin: 6px 0 0 2px; }
  .wave-card input{
    width:100%; background: var(--panel-2); border:1px solid var(--line); border-radius:8px;
    color: var(--text); padding: 8px 8px; font-size:13px; font-family:'IBM Plex Mono',monospace;
  }
  .wave-card input:focus{ outline:none; border-color: var(--amber); }
  .wave-remove{
    background: transparent; border:1px solid var(--line); color: var(--text-dim);
    border-radius:8px; width:32px; height:34px; cursor:pointer; font-size:16px; line-height:1;
  }
  .wave-remove:hover{ color: var(--red); border-color: var(--red); }
  .btn{
    background: var(--amber); color:#171208; border:none; border-radius:9px;
    padding: 12px 18px; font-size:14px; font-weight:700; cursor:pointer;
    font-family:'Inter',sans-serif; width:100%;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-ghost{
    background:transparent; color: var(--text-dim); border:1px solid var(--line);
    border-radius:9px; padding:8px 14px; font-size:12px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn-ghost:hover{ color: var(--text); border-color: var(--steel); }

  .link-card{
    background: var(--panel); border:1px solid var(--line); border-radius:14px;
    padding: 16px 18px; margin-bottom:14px;
  }
  .link-row{ display:flex; gap:10px; align-items:flex-end; }
  .link-field{ flex:1; }
  .link-field label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:6px; }
  .link-field input{
    width:100%; background: var(--panel-2); border:1px solid var(--line); border-radius:8px;
    color: var(--text); padding: 9px 12px; font-size:13px; font-family:'IBM Plex Mono',monospace;
  }
  .link-field input:focus{ outline:none; border-color: var(--amber); }
  .link-open{ white-space:nowrap; padding:9px 16px; }
  .link-hint{ font-size:10.5px; color:var(--text-dim); margin-top:8px; line-height:1.7; }

  .status-card{
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--line); border-radius:16px; padding: 24px; margin-bottom:16px;
    position:relative; overflow:hidden;
  }
  .status-band{
    position:absolute; inset:0 0 auto 0; height:4px;
  }
  .status-label{
    font-size:13px; color:var(--text-dim); margin-bottom:4px;
  }
  .status-headline{
    font-size: 30px; font-weight:800; margin-bottom: 2px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  }
  .status-sub{ font-size:12.5px; color: var(--text-dim); }
  .live-pace{
    font-size: 12px; color: var(--text-dim); margin-top:14px; padding-top:14px;
    border-top:1px solid var(--line);
  }
  .num-live-pace{
    font-size: 22px; font-weight:800; color: var(--amber);
    font-family:'IBM Plex Mono', monospace;
  }

  .flap-row{
    display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:20px;
  }
  .flap{
    background:#0d1013; border:1px solid var(--line); border-radius:10px;
    padding:14px 10px; text-align:center;
  }
  .flap .val{
    font-size:26px; font-weight:700; letter-spacing:.5px;
  }
  .flap .lbl{
    font-size:10.5px; color:var(--text-dim); margin-top:6px;
  }

  .bar-wrap{ margin-top:20px; }
  .bar-track{
    background:#0d1013; border:1px solid var(--line); border-radius:999px; height:16px; position:relative; overflow:hidden;
  }
  .bar-fill{
    height:100%; border-radius:999px; transition: width .4s ease, background .4s ease;
  }
  .bar-target-mark{
    position:absolute; top:-3px; bottom:-3px; width:2px; background: var(--text);
    box-shadow: 0 0 0 2px rgba(255,255,255,.08);
  }
  .bar-labels{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-dim); margin-top:6px; }

  .break-note{
    margin-top:10px; font-size:11px; color:var(--amber); display:none;
  }
  .break-note.show{ display:block; }

  .log-card{
    background: var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px;
  }
  .log-card h3{ font-size:13px; margin:0 0 12px; }
  .log-input-row{ display:flex; gap:10px; }
  .log-input-row input{ flex:1; }
  .log-input-row button{ width:auto; padding: 10px 20px; }
  .history{ margin-top:16px; max-height:160px; overflow-y:auto; }
  .history-item{
    display:flex; justify-content:space-between; font-size:12px; padding:7px 2px;
    border-bottom:1px solid var(--line); color: var(--text-dim);
  }
  .history-item .cnt{ color: var(--text); font-family:'IBM Plex Mono',monospace; }

  .footer-row{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:10px; flex-wrap:wrap; }
  .hint{ font-size:11px; color:var(--text-dim); line-height:1.9; margin-top:10px; }

  .pulse{ animation: pulseAnim .5s ease; }
  @keyframes pulseAnim{
    0%{ transform: scale(1); }
    30%{ transform: scale(1.04); }
    100%{ transform: scale(1); }
  }

  .hidden{ display:none !important; }

  @media (max-width:480px){
    .flap-row{ grid-template-columns: 1fr 1fr; }
    .flap-row .flap:last-child{ grid-column: span 2; }
    .flap .val{ font-size:21px; }
    .status-headline{ font-size:24px; }
    .row3{ grid-template-columns: 1fr; }
    .wave-row-top{ grid-template-columns: 128px 1fr 28px; gap:4px; }
    .wave-card input{ padding:8px 5px; font-size:12px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="title" id="tTitle">Induct Pace Tracker</div>
      <div class="stat-total" id="dayTotalLabel">—</div>
      <div class="stat-pace" id="requiredPaceLabel"></div>
      <div class="subtitle" id="arrivedSoFarLabel"></div>
    </div>
    <div style="text-align:right">
      <div class="clock mono" id="clockNow">--:--:--</div>
      <div class="clock-date" id="clockDate">—</div>
      <div class="lang-toggle">
        <button class="lang-btn" id="btnLangEn">EN</button>
        <button class="lang-btn" id="btnLangDe">DE</button>
      </div>
    </div>
  </header>

  <!-- SETUP -->
  <div class="setup-card" id="setupCard">
    <h2 id="tSetupHeading">Start today's shift</h2>
    <div class="field">
      <label id="lblWaves">Planned arrival waves (time + small + large)</label>
      <div id="waveRows"></div>
      <button type="button" class="btn-ghost" id="btnAddWave" style="width:100%; margin-top:6px;"></button>
      <div class="hint" id="waveTotalsHint" style="margin-top:8px;"></div>
    </div>
    <div class="row2">
      <div class="field">
        <label id="lblLargeWeight">Large package weight (× small)</label>
        <input type="number" id="inputLargeWeight" value="2" step="0.1" inputmode="decimal">
      </div>
      <div class="field">
        <label id="lblSplitPct">% processed before break</label>
        <input type="number" id="inputSplitPct" value="40" inputmode="numeric">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label id="lblStart">Shift start time</label>
        <input type="time" id="inputStart" value="02:00">
      </div>
      <div class="field">
        <label id="lblEnd">Shift end time</label>
        <input type="time" id="inputEnd" value="09:00">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label id="lblBreakStart">Break start time (30 min)</label>
        <input type="time" id="inputBreakStart" value="05:00">
      </div>
      <div class="field">
        <label id="lblBuffer">Safety buffer (min)</label>
        <input type="number" id="inputBuffer" value="0" inputmode="numeric">
      </div>
    </div>
    <button class="btn" id="btnStart">Start tracking</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="link-card" id="linkCard">
      <div class="link-row">
        <div class="link-field">
          <label id="tLinkLabel">WMS panel link (reference)</label>
          <input type="url" id="inputPanelLink" placeholder="https://...">
        </div>
        <button class="btn-ghost link-open" id="btnOpenPanel"></button>
      </div>
      <div class="link-hint" id="tLinkHint"></div>
    </div>

    <div class="status-card">
      <div class="status-band" id="statusBand"></div>
      <div class="status-label" id="tStatusLabel">Current status</div>
      <div class="status-headline">
        <span id="statusMain" class="mono">—</span>
      </div>
      <div class="status-sub" id="statusSub">—</div>
      <div class="live-pace" id="livePaceLabel"></div>

      <div class="flap-row">
        <div class="flap">
          <div class="val mono" id="flapTarget">0</div>
          <div class="lbl" id="tFlapTargetLbl">should be processed by now</div>
        </div>
        <div class="flap">
          <div class="val mono" id="flapActual">0</div>
          <div class="lbl" id="tFlapActualLbl">actually processed</div>
        </div>
        <div class="flap">
          <div class="val mono" id="flapDelta">0</div>
          <div class="lbl" id="tFlapDeltaLbl">difference (packages)</div>
        </div>
      </div>

      <div class="bar-wrap">
        <div class="bar-track">
          <div class="bar-fill" id="barFill" style="width:0%; background:var(--amber);"></div>
          <div class="bar-target-mark" id="barTargetMark" style="left:0%;"></div>
        </div>
        <div class="bar-labels">
          <span id="barPct">0% of packages</span>
          <span id="timePct">0% of working time elapsed</span>
        </div>
      </div>

      <div class="hint" id="paceHint"></div>
    </div>

    <div class="log-card">
      <h3 id="tLogHeading">Log new progress</h3>
      <div class="field">
        <label id="lblActualTotal">Total processed so far (if mix unknown)</label>
        <input type="number" id="inputActualTotal" inputmode="numeric" class="mono">
      </div>
      <div class="wave-or-label" id="tActualOrLabel" style="margin-bottom:6px;"></div>
      <div class="row2" style="margin-bottom:10px;">
        <div class="field" style="margin-bottom:0;">
          <label id="lblActualSmall">Small processed so far</label>
          <input type="number" id="inputActualSmall" inputmode="numeric" class="mono">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label id="lblActualLarge">Large processed so far</label>
          <input type="number" id="inputActualLarge" inputmode="numeric" class="mono">
        </div>
      </div>
      <button class="btn" id="btnLog"></button>
      <div class="history" id="historyList"></div>
    </div>

    <div class="footer-row">
      <button class="btn-ghost" id="btnEditConfig"></button>
      <button class="btn-ghost" id="btnResetDay"></button>
    </div>
  </div>

</div>

<script>
(function(){
  // Fallback storage shim: outside Claude's artifact runtime, window.storage
  // doesn't exist. When missing, back it with localStorage so data still
  // persists on a standalone deployment (Vercel, GitHub Pages, etc.).
  if(!window.storage){
    window.storage = {
      async get(key){
        const raw = localStorage.getItem(key);
        if(raw === null){ throw new Error('not found'); }
        return { key, value: raw };
      },
      async set(key, value){
        localStorage.setItem(key, value);
        return { key, value };
      },
      async delete(key){
        localStorage.removeItem(key);
        return { key, deleted:true };
      },
      async list(prefix){
        const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
        return { keys, prefix };
      }
    };
  }

  const STORAGE_KEY_CONFIG = 'config';

      btnResetDay: 'Neuen Tag starten',
      totalLabel: 'Gesamt heute: {{n}} Pakete ({{s}} klein + {{l}} groß)  •  Zeitfenster: {{ws}} – {{we}}',
      notStarted: 'Noch nicht gestartet',
      shiftStartsAt: (s) => `Schicht beginnt um ${s}`,

      noTotalEntered: 'Paketanzahl nicht eingetragen',
      onBreak: 'Pause',
      onBreakSub: (t) => `Pause endet um ${t} — Zielwert pausiert`,
      aheadBy: (n) => `${n} Pakete voraus`,

  function todayKey(){

    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `day:${y}-${m}-${day}`;

  function fmtClock(d){ return d.toLocaleTimeString('en-GB', {hour12:false}); }
  function fmtTimeShort(d){ return d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', hour12:false}); }
  function fmtNum(n){ return Math.round(n).toLocaleString(lang === 'de' ? 'de-DE' : 'en-US'); }

  function parseTimeToday(hhmm){
    const [h,m] = hhmm.split(':').map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    return d;
  }

  function getWindow(){
    const start = parseTimeToday(config.startTime);
    const shiftEnd = parseTimeToday(config.shiftEnd);
    const deadline = new Date(shiftEnd.getTime() - (config.bufferMinutes||0)*60000);
    const breakStart = parseTimeToday(config.breakStart);
    const breakEnd = new Date(breakStart.getTime() + BREAK_MINUTES*60000);
    return {start, deadline, shiftEnd, breakStart, breakEnd};
  }

  function computeState(){
    const {start, deadline, shiftEnd, breakStart, breakEnd} = getWindow();
    const now = new Date();

    const rawWindowMs = deadline - start;

    // Clamp the break to the actual [start, deadline] window so the break
    // duration used for "total working time" always matches the break
    // portion actually subtracted from elapsed time — even if the chosen
    // break start/end falls partly (or fully) outside the shift window.
    const effBreakStart = new Date(Math.min(Math.max(breakStart.getTime(), start.getTime()), deadline.getTime()));
    const effBreakEnd = new Date(Math.min(Math.max(breakEnd.getTime(), start.getTime()), deadline.getTime()));
    const effectiveBreakMs = Math.max(0, effBreakEnd - effBreakStart);

    const workingWindowMs = Math.max(0, rawWindowMs - effectiveBreakMs);

    // Two work segments: before the break, and after the break.
    const seg1DurationMs = Math.max(0, effBreakStart - start);
    const seg2DurationMs = Math.max(0, deadline - effBreakEnd);

    let elapsedRaw = now - start;
    if(elapsedRaw < 0) elapsedRaw = 0;
    if(elapsedRaw > rawWindowMs) elapsedRaw = rawWindowMs;

    const overlapEnd = new Date(Math.min(now.getTime(), effBreakEnd.getTime()));
    let overlap = overlapEnd - effBreakStart;
    if(overlap < 0) overlap = 0;
    if(overlap > effectiveBreakMs) overlap = effectiveBreakMs;

    const elapsedWorking = Math.max(0, elapsedRaw - overlap);

    const allWaves = dayData.waves || [];
    const largeWeight = config.largeWeight || 1;

    // Waves with an explicit small/large split are exact. Waves that only
    // give a total (mix unknown) get their split estimated from the ratio
    // of all explicit waves — falling back to a neutral 50/50 assumption
    // if no explicit waves exist yet.
    let explicitSmallSum = 0, explicitLargeSum = 0, unknownTotalSum = 0;
    allWaves.forEach(w => {
      const s = Number(w.small)||0, l = Number(w.large)||0, tot = Number(w.total)||0;
      if(s>0 || l>0){ explicitSmallSum += s; explicitLargeSum += l; }
      else if(tot>0){ unknownTotalSum += tot; }
    });
    const explicitPhysical = explicitSmallSum + explicitLargeSum;
    const assumedLargeFraction = explicitPhysical > 0 ? (explicitLargeSum/explicitPhysical) : 0.5;
    const estSmallFromUnknown = unknownTotalSum * (1-assumedLargeFraction);
    const estLargeFromUnknown = unknownTotalSum * assumedLargeFraction;

    const smallTotal = explicitSmallSum + estSmallFromUnknown;
    const largeTotal = explicitLargeSum + estLargeFromUnknown;
    const totalPhysical = explicitPhysical + unknownTotalSum;
    const totalEffort = smallTotal + largeTotal*largeWeight;
    const avgWeight = totalPhysical > 0 ? totalEffort/totalPhysical : 1;

    const splitFraction = Math.min(1, Math.max(0, (config.splitPct!=null ? config.splitPct : 40)/100));
    const seg1EffortTarget = totalEffort * splitFraction;
    const seg2EffortTarget = totalEffort - seg1EffortTarget;

    // Piecewise ideal target: seg1 ramps up to seg1EffortTarget by break-start,
    // freezes through the break, then seg2 ramps the rest up to totalEffort.
    let idealTargetEffortNow;
    if(now <= effBreakStart){
      const elapsed1 = Math.min(seg1DurationMs, Math.max(0, now - start));
      idealTargetEffortNow = seg1DurationMs > 0 ? seg1EffortTarget * (elapsed1/seg1DurationMs) : (now >= start ? seg1EffortTarget : 0);
    } else if(now < effBreakEnd){
      idealTargetEffortNow = seg1EffortTarget;
    } else {
      const elapsed2 = Math.min(seg2DurationMs, Math.max(0, now - effBreakEnd));
      idealTargetEffortNow = seg1EffortTarget + (seg2DurationMs > 0 ? seg2EffortTarget * (elapsed2/seg2DurationMs) : seg2EffortTarget);
    }
    idealTargetEffortNow = Math.min(totalEffort, Math.max(0, idealTargetEffortNow));

    // Packages can't be processed before they physically arrive. Cap the
    // ideal deadline-paced target by what's actually arrived so far per the
    // planned wave schedule — this way, a wave that's early doesn't force
    // an unrealistic rush, and a wave that's late doesn't unfairly count
    // as "falling behind".
    let arrivedExplicitSmall = 0, arrivedExplicitLarge = 0, arrivedUnknownTotal = 0;
    allWaves.forEach(w => {
      if(!w.time) return;
      const wTime = parseTimeToday(w.time);
      if(wTime > now) return;
      const s = Number(w.small)||0, l = Number(w.large)||0, tot = Number(w.total)||0;
      if(s>0 || l>0){ arrivedExplicitSmall += s; arrivedExplicitLarge += l; }
      else if(tot>0){ arrivedUnknownTotal += tot; }
    });
    // Physical count of what's arrived is always exact, even for
    // mix-unknown waves — only the type breakdown (used for effort/weighting)
    // is estimated, using the same ratio derived from explicit waves above.
    const arrivedPhysicalNow = arrivedExplicitSmall + arrivedExplicitLarge + arrivedUnknownTotal;
    const arrivedEffortNow = arrivedExplicitSmall + arrivedExplicitLarge*largeWeight
      + arrivedUnknownTotal*(1-assumedLargeFraction) + arrivedUnknownTotal*assumedLargeFraction*largeWeight;

    const targetEffortNow = Math.min(idealTargetEffortNow, arrivedEffortNow);
    // When the arrival cap is the binding constraint, we know the exact
    // physical mix that's arrived — use that directly rather than converting
    // through the blended average weight (which would misrepresent a wave
    // whose small/large mix differs from the day's overall planned mix).
    const targetPhysicalNow = (arrivedEffortNow <= idealTargetEffortNow)
      ? arrivedPhysicalNow
      : (avgWeight > 0 ? idealTargetEffortNow/avgWeight : 0);

    const lastLog = dayData.log.length ? dayData.log[dayData.log.length-1] : null;
    const loggedSmall = lastLog ? (lastLog.small||0) : 0;
    const loggedLarge = lastLog ? (lastLog.large||0) : 0;
    const loggedTotal = lastLog ? (lastLog.total||0) : 0;
    // If the person only logged a total (mix unknown), estimate its
    // small/large split using the same ratio derived from the wave plan —
    // physical count stays exact either way.
    const actualHasExplicitMix = loggedSmall>0 || loggedLarge>0;
    const actualSmall = actualHasExplicitMix ? loggedSmall : loggedTotal*(1-assumedLargeFraction);
    const actualLarge = actualHasExplicitMix ? loggedLarge : loggedTotal*assumedLargeFraction;
    const actualPhysical = actualHasExplicitMix ? (loggedSmall+loggedLarge) : loggedTotal;
    const actualEffort = actualSmall + actualLarge*largeWeight;

    const deltaEffort = actualEffort - targetEffortNow;
    const deltaPhysical = actualPhysical - targetPhysicalNow;
    const blendedRate = workingWindowMs > 0 ? totalEffort / (workingWindowMs/3600000) : 0;
    const deltaMinutes = blendedRate > 0 ? (deltaEffort / blendedRate) * 60 : 0;

    const rate1Effort = seg1DurationMs > 0 ? seg1EffortTarget / (seg1DurationMs/3600000) : 0;
    const rate2Effort = seg2DurationMs > 0 ? seg2EffortTarget / (seg2DurationMs/3600000) : 0;
    const rate1Physical = avgWeight > 0 ? rate1Effort/avgWeight : 0;
    const rate2Physical = avgWeight > 0 ? rate2Effort/avgWeight : 0;

    const beforeStart = now < start;
    const afterDeadline = now > deadline;
    const onBreak = now >= breakStart && now < breakEnd && now >= start && now < deadline;

    const pctTime = workingWindowMs > 0 ? Math.min(100, Math.max(0, (elapsedWorking/workingWindowMs)*100)) : 0;
    const pctPkg = totalPhysical > 0 ? Math.min(100, Math.max(0, (actualPhysical/totalPhysical)*100)) : 0;
    const pctTarget = totalEffort > 0 ? Math.min(100, Math.max(0, (targetEffortNow/totalEffort)*100)) : 0;

    // Remaining physical packages / remaining working hours — an exact
    // figure regardless of weighting, since it's just "how many items are
    // left to clear in the time that's left".
    const remainingSmall = Math.max(0, smallTotal - actualSmall);
    const remainingLarge = Math.max(0, largeTotal - actualLarge);
    const remainingPhysical = remainingSmall + remainingLarge;
    const remainingWorkingMs = Math.max(0, workingWindowMs - elapsedWorking);
    const neededPhysicalRatePerHour = remainingWorkingMs > 0 ? remainingPhysical / (remainingWorkingMs/3600000) : null;

    return { start, deadline, shiftEnd, breakStart, breakEnd, now,
      smallTotal, largeTotal, totalPhysical, totalEffort, avgWeight, largeWeight,
      targetEffortNow, targetPhysicalNow, arrivedPhysicalNow, actualSmall, actualLarge, actualPhysical, actualEffort,
      deltaEffort, deltaPhysical, deltaMinutes,
      rate1Physical, rate2Physical,
      beforeStart, afterDeadline, onBreak, pctTime, pctPkg, pctTarget,
      neededPhysicalRatePerHour, remainingPhysical };
  }

  function syncWaveDraftFromDOM(){
    const cards = document.querySelectorAll('#waveRows .wave-card');
    cards.forEach((card, i) => {
      if(!waveDraft[i]) return;
      waveDraft[i].time = card.querySelector('.wave-time').value;
      waveDraft[i].total = card.querySelector('.wave-total').value;
      waveDraft[i].small = card.querySelector('.wave-small').value;
      waveDraft[i].large = card.querySelector('.wave-large').value;
    });
  }

  function renderWaveRows(){
    const container = document.getElementById('waveRows');
    if(!container) return;
    if(waveDraft.length === 0){
      waveDraft.push({ time: config.startTime || '02:00', small: '', large: '', total: '' });
    }
    container.innerHTML = '';
    waveDraft.forEach((w, i) => {
      const card = document.createElement('div');
      card.className = 'wave-card';
      card.innerHTML = `
        <div class="wave-row-top">
          <input type="time" class="wave-time mono" value="${w.time || ''}">
          <input type="number" class="wave-total mono" placeholder="${t('waveTotalPh')}" inputmode="numeric" value="${w.total||''}">
          <button type="button" class="wave-remove">×</button>
        </div>
        <div class="wave-or-label">${t('waveOrLabel')}</div>
        <div class="wave-row-bottom">
          <input type="number" class="wave-small mono" placeholder="${t('waveSmallPh')}" inputmode="numeric" value="${w.small||''}">
          <input type="number" class="wave-large mono" placeholder="${t('waveLargePh')}" inputmode="numeric" value="${w.large||''}">
        </div>
      `;
      card.querySelector('.wave-time').addEventListener('change', (e) => { waveDraft[i].time = e.target.value; updateWaveTotalsHint(); });
      card.querySelector('.wave-total').addEventListener('input', (e) => { waveDraft[i].total = e.target.value; updateWaveTotalsHint(); });
      card.querySelector('.wave-small').addEventListener('input', (e) => { waveDraft[i].small = e.target.value; updateWaveTotalsHint(); });
      card.querySelector('.wave-large').addEventListener('input', (e) => { waveDraft[i].large = e.target.value; updateWaveTotalsHint(); });
      card.querySelector('.wave-remove').addEventListener('click', () => {
        waveDraft.splice(i, 1);
        renderWaveRows();
      });
      container.appendChild(card);
    });
    updateWaveTotalsHint();
  }

  function updateWaveTotalsHint(){
    const hint = document.getElementById('waveTotalsHint');
    if(!hint) return;
    let small = 0, large = 0, unknown = 0;
    waveDraft.forEach(w => {
      const s = Number(w.small)||0, l = Number(w.large)||0, tot = Number(w.total)||0;
      if(s>0 || l>0){ small += s; large += l; }
      else if(tot>0){ unknown += tot; }
    });
    const grand = small+large+unknown;
    hint.textContent = unknown > 0
      ? t('waveTotalsHintUnknown')(fmtNum(grand), fmtNum(small), fmtNum(large), fmtNum(unknown))
      : t('waveTotalsHint')(fmtNum(grand), fmtNum(small), fmtNum(large));
  }

  document.getElementById('btnAddWave').addEventListener('click', () => {
    syncWaveDraftFromDOM();
    const lastTime = waveDraft.length ? waveDraft[waveDraft.length-1].time : (config.startTime || '02:00');
    waveDraft.push({ time: lastTime, small: '', large: '', total: '' });
    renderWaveRows();
  });

  function render(){
    document.getElementById('clockNow').textContent = fmtClock(new Date());
    document.getElementById('clockDate').textContent = new Date().toLocaleDateString(lang === 'de' ? 'de-DE' : 'en-GB');

    const hasData = Array.isArray(dayData.waves) && dayData.waves.length > 0;

    if(!hasData || isEditing){
      document.getElementById('setupCard').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
      return;
    }
    document.getElementById('setupCard').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');

    const s = computeState();
    document.getElementById('dayTotalLabel').innerHTML = t('totalLabel')
      .replace('{{n}}', `<span class="num-total">${fmtNum(s.totalPhysical)}</span>`)
      .replace('{{s}}', fmtNum(s.smallTotal))
      .replace('{{l}}', fmtNum(s.largeTotal))
      .replace('{{ws}}', fmtTimeShort(s.start))
      .replace('{{we}}', fmtTimeShort(s.deadline));
    document.getElementById('requiredPaceLabel').innerHTML = s.totalPhysical > 0
      ? t('requiredPace')
          .replace('{{n1}}', `<span class="num-pace">${fmtNum(s.rate1Physical)}</span>`)
          .replace('{{n2}}', `<span class="num-pace">${fmtNum(s.rate2Physical)}</span>`)
      : '';
    document.getElementById('arrivedSoFarLabel').textContent = (s.totalPhysical > 0 && !s.beforeStart)
      ? t('arrivedSoFar')(fmtNum(s.arrivedPhysicalNow))
      : '';

    const band = document.getElementById('statusBand');
    const main = document.getElementById('statusMain');
    const sub = document.getElementById('statusSub');
    const barFill = document.getElementById('barFill');
    const barMark = document.getElementById('barTargetMark');

    if(s.beforeStart){
      band.style.background = 'var(--steel)';
      main.style.color = 'var(--steel)';
      main.textContent = t('notStarted');
      sub.textContent = t('shiftStartsAt')(fmtTimeShort(s.start));
    } else if (s.totalPhysical <= 0) {
      band.style.background = 'var(--steel)';
      main.style.color = 'var(--steel)';
      main.textContent = t('waitingData');
      sub.textContent = t('noTotalEntered');
    } else if (s.onBreak) {
      band.style.background = 'var(--amber)';
      main.style.color = 'var(--amber)';
      main.textContent = t('onBreak');
      sub.textContent = t('onBreakSub')(fmtTimeShort(s.breakEnd));
    } else {
      const absDeltaPhysical = Math.abs(s.deltaPhysical);
      const isAhead = s.deltaEffort >= -1;
      const color = isAhead ? 'var(--green)' : 'var(--red)';
      band.style.background = color;
      main.style.color = color;
      main.textContent = isAhead ? t('aheadBy')(fmtNum(absDeltaPhysical)) : t('behindBy')(fmtNum(absDeltaPhysical));

      const minTxt = Math.abs(s.deltaMinutes) < 1 ? t('lessThanMin') : t('minutes')(fmtNum(Math.abs(s.deltaMinutes)));
      sub.textContent = isAhead ? t('roughlyAhead')(minTxt) : t('roughlyBehind')(minTxt);
      if(s.afterDeadline){ sub.textContent += '  •  ' + t('deadlineReached'); }
    }

    document.getElementById('flapTarget').textContent = fmtNum(s.targetPhysicalNow);
    document.getElementById('flapActual').textContent = fmtNum(s.actualPhysical);
    const deltaEl = document.getElementById('flapDelta');
    deltaEl.textContent = (s.deltaPhysical >= 0 ? '+' : '−') + fmtNum(Math.abs(s.deltaPhysical));
    deltaEl.style.color = s.totalPhysical>0 ? (s.deltaEffort >= -1 ? 'var(--green)' : 'var(--red)') : 'var(--text)';

    barFill.style.width = s.pctPkg + '%';
    barFill.style.background = s.totalPhysical>0 ? (s.deltaEffort >= -1 ? 'var(--green)' : 'var(--red)') : 'var(--amber)';
    barMark.style.left = s.pctTarget + '%';
    document.getElementById('barPct').textContent = t('pctPackages')(fmtNum(s.pctPkg));
    document.getElementById('timePct').textContent = t('pctTime')(fmtNum(s.pctTime));

    const paceHint = document.getElementById('paceHint');
    if(s.totalPhysical>0 && !s.beforeStart && !s.afterDeadline && !s.onBreak){
      if(s.remainingPhysical <= 0){
        paceHint.textContent = t('allDone');
      } else if(s.neededPhysicalRatePerHour !== null){
        const onTrack = Math.abs(s.deltaMinutes) <= 2;
        if(onTrack){
          paceHint.textContent = t('onTrackMsg');
        } else if(s.deltaEffort < 0){
          paceHint.textContent = t('speedUp')(fmtNum(s.neededPhysicalRatePerHour));
        } else {
          paceHint.textContent = t('easeOff')(fmtNum(s.neededPhysicalRatePerHour));
        }
      } else {
        paceHint.textContent = '';
      }
    } else {
      paceHint.textContent = '';
    }

    const livePace = document.getElementById('livePaceLabel');
    if(s.totalPhysical>0 && !s.beforeStart && !s.afterDeadline && !s.onBreak){
      if(s.remainingPhysical <= 0){
        livePace.innerHTML = t('livePaceDone');
      } else if(s.neededPhysicalRatePerHour !== null){
        livePace.innerHTML = t('livePaceNeeded').replace('{{n}}', `<span class="num-live-pace">${fmtNum(s.neededPhysicalRatePerHour)}</span>`);
      } else {
        livePace.innerHTML = '';
      }
    } else {
      livePace.innerHTML = '';
    }

    const hist = document.getElementById('historyList');
    hist.innerHTML = '';
    [...dayData.log].reverse().forEach(item => {
      const row = document.createElement('div');
      row.className = 'history-item';
      const time = new Date(item.time);
      const hasExplicit = (item.small||0) > 0 || (item.large||0) > 0;
      const total = hasExplicit ? ((item.small||0) + (item.large||0)) : (item.total||0);
      const detail = hasExplicit ? `(${fmtNum(item.small||0)}S / ${fmtNum(item.large||0)}L)` : t('mixUnknownTag');
      row.innerHTML = `<span>${fmtTimeShort(time)}</span><span class="cnt mono">${fmtNum(total)} ${detail}</span>`;
      hist.appendChild(row);
    });
  }

  // ---- events ----
  function timeToMinutes(hhmm){
    const [h,m] = hhmm.split(':').map(Number);
    return h*60 + m;
  }
  function fmtMinutesAsTime(mins){
    const h = Math.floor(((mins%1440)+1440)%1440 / 60);
    const m = ((mins%1440)+1440)%1440 % 60;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  }

  document.getElementById('btnStart').addEventListener('click', async () => {
    syncWaveDraftFromDOM();
    const cleanWaves = waveDraft
      .filter(w => w.time && ((Number(w.small)||0) > 0 || (Number(w.large)||0) > 0 || (Number(w.total)||0) > 0))
      .map(w => ({ time: w.time, small: Number(w.small)||0, large: Number(w.large)||0, total: Number(w.total)||0 }));

    const smallCount = cleanWaves.reduce((sum,w) => sum + (w.small>0||w.large>0 ? w.small : 0), 0);
    const largeCount = cleanWaves.reduce((sum,w) => sum + (w.small>0||w.large>0 ? w.large : 0), 0);
    const unknownCount = cleanWaves.reduce((sum,w) => sum + (w.small===0 && w.large===0 ? w.total : 0), 0);
    const largeWeight = parseFloat(document.getElementById('inputLargeWeight').value);
    const splitPct = parseFloat(document.getElementById('inputSplitPct').value);
    const start = document.getElementById('inputStart').value;
    const end = document.getElementById('inputEnd').value;
    const breakStart = document.getElementById('inputBreakStart').value;
    const buf = parseInt(document.getElementById('inputBuffer').value, 10);
    if(smallCount <= 0 && largeCount <= 0 && unknownCount <= 0){ alert(t('confirmTotal')); return; }
    if(!start || !end || !breakStart){ alert(t('errMissingTime')); return; }

    const startMin = timeToMinutes(start);
    const endMin = timeToMinutes(end);
    const bufMin = isNaN(buf) ? 0 : buf;
    const deadlineMin = endMin - bufMin;

    if(startMin >= endMin){ alert(t('errStartAfterEnd')); return; }
    if(deadlineMin <= startMin){ alert(t('errBufferTooLarge')); return; }

    const breakStartMin = timeToMinutes(breakStart);
    const breakEndMin = breakStartMin + BREAK_MINUTES;
    if(breakStartMin < startMin || breakEndMin > deadlineMin){
      alert(t('errBreakOutside')(start, fmtMinutesAsTime(deadlineMin)));
      return;
    }

    config.startTime = start;
    config.shiftEnd = end;
    config.breakStart = breakStart;
    config.bufferMinutes = bufMin;
    config.largeWeight = (isNaN(largeWeight) || largeWeight <= 0) ? 1 : largeWeight;
    config.splitPct = isNaN(splitPct) ? 40 : Math.min(100, Math.max(0, splitPct));
    if(!isEditing){ dayData.log = []; }
    dayData.waves = cleanWaves;
    isEditing = false;
    await saveConfig();
    await saveDay();
    render();
  });

  document.getElementById('btnLog').addEventListener('click', async () => {
    const total = parseInt(document.getElementById('inputActualTotal').value, 10);
    const small = parseInt(document.getElementById('inputActualSmall').value, 10);
    const large = parseInt(document.getElementById('inputActualLarge').value, 10);
    const totalVal = isNaN(total) ? 0 : total;
    const smallVal = isNaN(small) ? 0 : small;
    const largeVal = isNaN(large) ? 0 : large;
    if(totalVal < 0 || smallVal < 0 || largeVal < 0) return;
    if(totalVal <= 0 && smallVal <= 0 && largeVal <= 0) return;
    dayData.log.push({ time: new Date().toISOString(), small: smallVal, large: largeVal, total: totalVal });
    await saveDay();
    render();
    const flap = document.getElementById('flapActual');
    flap.classList.remove('pulse'); void flap.offsetWidth; flap.classList.add('pulse');
  });

  document.getElementById('inputActualTotal').addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ document.getElementById('btnLog').click(); }
  });
  document.getElementById('inputActualSmall').addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ document.getElementById('btnLog').click(); }
  });
  document.getElementById('inputActualLarge').addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ document.getElementById('btnLog').click(); }
  });

  document.getElementById('btnResetDay').addEventListener('click', async () => {
    if(!confirm(t('confirmReset'))) return;
    dayData = { smallTotal: null, largeTotal: null, waves: [], log: [] };
    isEditing = false;
    await saveDay();
    render();
  });

  document.getElementById('btnEditConfig').addEventListener('click', () => {
    isEditing = true;
    waveDraft = (dayData.waves && dayData.waves.length)
      ? dayData.waves.map(w => {
          const isUnknown = (!w.small && !w.large) && w.total;
          return {
            time: w.time,
            small: isUnknown ? '' : String(w.small||''),
            large: isUnknown ? '' : String(w.large||''),
            total: isUnknown ? String(w.total) : ''
          };
        })
      : [{ time: config.startTime || '02:00', small: '', large: '', total: '' }];
    renderWaveRows();
    document.getElementById('inputLargeWeight').value = config.largeWeight;
    document.getElementById('inputSplitPct').value = config.splitPct;
    document.getElementById('inputStart').value = config.startTime;
    document.getElementById('inputEnd').value = config.shiftEnd;
    document.getElementById('inputBreakStart').value = config.breakStart;
    document.getElementById('inputBuffer').value = config.bufferMinutes;
    document.getElementById('setupCard').classList.remove('hidden');
    document.getElementById('dashboard').classList.add('hidden');
  });

  async function setLang(l){
    lang = l;
    applyStaticText();
    render();
    await saveConfig();
  }
  document.getElementById('btnLangEn').addEventListener('click', () => setLang('en'));
  document.getElementById('btnLangDe').addEventListener('click', () => setLang('de'));

  document.getElementById('inputPanelLink').addEventListener('change', async (e) => {
    config.panelLink = e.target.value.trim();
    await saveConfig();
  });
  document.getElementById('btnOpenPanel').addEventListener('click', () => {
    const url = document.getElementById('inputPanelLink').value.trim();
    if(!url) return;
    window.open(url, '_blank', 'noopener');
  });

  // ---- init ----
  async function init(){
    await loadConfig();
    await loadDay();
    applyStaticText();
    document.getElementById('inputBreakStart').value = config.breakStart;
    document.getElementById('inputBuffer').value = config.bufferMinutes;
    document.getElementById('inputLargeWeight').value = config.largeWeight;
    document.getElementById('inputSplitPct').value = config.splitPct;
    document.getElementById('inputPanelLink').value = config.panelLink || '';
    render();
    setInterval(async () => {
      const k = todayKey();
      if(k !== dayKey){ await loadDay(); }
      render();
    }, 1000);
  }
  init();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
